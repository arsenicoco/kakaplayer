name: KakaPlayer
options:
  bundleIdPrefix: dev.kakaplayer
  deploymentTarget:
    macOS: "26.0"
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.3"
packages:
  VLCKitBinary:
    path: Packages/VLCKitBinary
targets:
  KakaPlayer:
    type: application
    platform: macOS
    sources:
      - path: KakaPlayer/Sources
      # Platform-agnostic engine client, shared with the upcoming iOS app.
      # Foundation/Darwin/Network only — no AppKit/UIKit/Virtualization in here.
      - path: Shared/Sources
      - path: KakaPlayer/Resources
        buildPhase: resources
    dependencies:
      - package: VLCKitBinary
        product: VLCKit
      - sdk: Virtualization.framework
    entitlements:
      path: KakaPlayer/KakaPlayer.entitlements
      properties:
        com.apple.security.virtualization: true
    info:
      path: KakaPlayer/Info.plist
      properties:
        CFBundleName: KakaPlayer
        CFBundleIconFile: AppIcon
        CFBundleDisplayName: KakaPlayer
        CFBundleIdentifier: dev.kakaplayer.KakaPlayer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "MIT. Bundles VLCKit (LGPL 2.1) and the Ace Stream engine (Ace Stream user agreement)."
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleURLTypes:
          - CFBundleURLName: Ace Stream link
            CFBundleURLSchemes: [acestream]
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "KakaPlayer shares the Ace Stream engine with your iPhone or iPad on the local network."
        NSBonjourServices: [_kakaplayer._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kakaplayer.KakaPlayer
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_APP_SANDBOX: false
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
        SWIFT_OBJC_INTEROP_MODE: objc

  # iPhone/iPad client. It has no engine of its own: it talks to an Ace Stream engine
  # over the network (a Mac running KakaPlayer, or any other reachable engine) whose
  # host:port the user types in Settings.
  KakaPlayerMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KakaPlayerMobile/Sources
      # Same platform-agnostic engine client and relay the Mac app uses.
      - path: Shared/Sources
    dependencies:
      # Xcode embeds and signs the binary framework into the app itself; an explicit
      # embed phase here would race that copy and fail the build.
      - package: VLCKitBinary
        product: VLCKit
    info:
      path: KakaPlayerMobile/Info.plist
      properties:
        CFBundleName: KakaPlayer
        CFBundleDisplayName: KakaPlayer
        CFBundleIdentifier: dev.kakaplayer.mobile
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.video
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keep the relay and the audio track alive while the screen is off.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: Ace Stream link
            CFBundleURLSchemes: [acestream]
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
        # Local networking only — the engine lives on the LAN. Never NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "KakaPlayer streams from an Ace Stream engine running on your Mac or another device on this network."
        NSBonjourServices: [_kakaplayer._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kakaplayer.mobile
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # No signing identity is checked in; Xcode/CI picks the team, and the simulator
        # build passes CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
        SWIFT_OBJC_INTEROP_MODE: objc
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
